<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置 - 儿童计划表</title>
  <link rel="stylesheet" href="styles.css?v=19" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="app-caption">设置</p>
        <h1>每日活动与积分配置</h1>
      </div>
      <div id="sync-status" class="sync-status">Supabase 同步状态初始化中…</div>
      <div style="display: flex; gap: 12px;">
        <a class="btn btn-secondary" href="library.html">图书馆</a>
        <a class="btn btn-secondary" href="reward-shop.html">奖励商店</a>
        <a class="btn btn-secondary" href="index.html">返回计划页</a>
      </div>
    </header>

    <section class="panel panel-settings" aria-labelledby="settings-page-title">
      <div class="panel-header">
        <h2 id="settings-page-title">活动与积分设置</h2>
        <p>设定每周目标，并编辑每日活动名、分值和是否可用。</p>
      </div>
      <div class="settings-grid">
        <div class="setting-item">
          <label for="weekly-goal">每周目标积分</label>
          <input id="weekly-goal" type="number" min="10" step="10" />
        </div>
        <div class="setting-item">
          <label for="reward-threshold">每日奖励阈值</label>
          <input id="reward-threshold" type="number" min="1" step="1" />
        </div>
      </div>

      <div class="panel-header" style="margin-top: 24px; gap: 12px; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap;">
        <div>
          <h3>活动列表</h3>
          <p>可编辑名称、设置分值、开启或关闭显示，并关联相关活动（如图书等）。</p>
        </div>
        <button class="btn btn-secondary btn-add" type="button" id="add-activity">新增活动</button>
      </div>
      <div class="activity-options" id="activities-list"></div>

      <div class="panel-header" style="margin-top: 24px; gap: 12px; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap;">
        <div>
          <h3>额外加分规则</h3>
          <p>设置规则：完成 x 次某项活动，则本周额外获得 y 分（可编辑）。</p>
        </div>
        <button class="btn btn-secondary btn-add" type="button" id="add-extra-bonus">新增规则</button>
      </div>
      <div class="activity-options" id="extra-bonuses-list"></div>

      <div class="panel-header" style="margin-top: 24px; gap: 12px; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap;">
        <div>
          <h3>本周必选活动</h3>
          <p>领取本周大奖励前必须完成的活动及次数。</p>
        </div>
        <button class="btn btn-secondary btn-add" type="button" id="add-required-activity">新增必选活动</button>
      </div>
      <div class="activity-options" id="required-activities-list"></div>

      <div class="message-box" id="settings-message"></div>
      <button class="btn btn-save" id="save-settings">保存设置</button>
    </section>
  </div>

  <!-- Book Selection Modal -->
  <div id="book-select-modal" class="modal-overlay hidden">
    <div class="modal" style="max-width: 420px;">
      <div class="modal-header">
        <h3>关联活动</h3>
        <button class="modal-close" id="book-select-modal-close">&times;</button>
      </div>
      <div id="book-select-modal-body" style="padding: 16px; max-height: 400px; overflow-y: auto;">
        <div id="book-select-list"></div>
      </div>
      <div style="padding: 16px; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center;">
        <span id="book-select-count" style="font-size: 14px; color: #6b7280;">已选择 0 本</span>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary" id="book-select-cancel">取消</button>
          <button class="btn btn-save" id="book-select-confirm">确定</button>
        </div>
      </div>
    </div>
  </div>

  <script src="supabase-loader.js?v=19"></script>
  <script src="supabase-config.js?v=19"></script>
  <script src="settings.js?v=19"></script>
</body>
</html>
